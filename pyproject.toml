[project]
name = "epl-forecast"
version = "0.1.0"
description = "Probabilistic forecasts and season simulations for the four English league divisions"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.94",
    "duckdb>=1.5.5",
    "numpy>=2.5.2",
    # DuckDB imports pytz to return TIMESTAMPTZ values as Python datetimes.
    "pytz>=2026.3.post1",
    "scipy>=1.18.1",
]

[project.scripts]
epl-forecast = "epl_forecast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter owns line length; it never wraps string literals, so E501
# would otherwise force diagnostic and provenance messages to be hand-split.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
