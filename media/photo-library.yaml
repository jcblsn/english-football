# Page 324 photo library
#
# A hand-maintained index of photographs that Page 324 can possibly use. It records
# where a photograph came from and what its licence permits, so that a later decision
# to publish it does not repeat the research.
#
# This file is a discovery and provenance index. It is not a publication contract, and
# nothing here is approved for publication only because it appears in this file.
#
# The image files are not in the repository. An entry points at the source page.
#
# To add a photograph, append an entry. Keep the entries in the order they were added.
# Read the licence on the source page yourself. Do not copy a licence from a similar
# photograph.

schema_version: 1

# status tells the reader how far an entry has gone.
#   saved     - the photograph is recorded, and nobody has checked the rights yet.
#   cleared   - the rights are checked and the photograph can be used.
#   used      - the photograph is published, and the credit is in place.
#   rejected  - the photograph is not for use. The reason is in notes.
statuses:
  - saved
  - cleared
  - used
  - rejected

photos:
  - id: arsenal-premier-league-trophy-2026
    status: saved
    teams:
      - arsenal
      - crystal-palace
    subject: Arsenal lift the Premier League trophy after the match against Crystal Palace
    date_taken: 2026-05-24
    source:
