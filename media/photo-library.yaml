      author: Chensiyuan
    rights:
      license: CC BY-SA 4.0
      license_url: https://creativecommons.org/licenses/by-sa/4.0/
      attribution_required: true
      share_alike: true
      personality_rights_warning: true
    suggested_credit: "Photo: Chensiyuan, CC BY-SA 4.0, via Wikimedia Commons"
    tags:
      - premier-league
      - trophy
      - celebration
      - season-2025-2026
    notes: >-
      The photographer gives the photograph as their own work. Share alike applies, so a
      changed version must keep the same licence. Commons holds a personality rights
      warning on the file, because the photograph shows identifiable players. Check the
      use against that warning before publication.
    accessed: 2026-09-17

  - id: tottenham-cup-winners-cup-final-1963
    status: saved
    teams:
      - tottenham-hotspur
    subject: The Tottenham Hotspur team at the 1963 European Cup Winners' Cup final against Atletico Madrid
    date_taken: 1963-05-15
    source:
      provider: Wikimedia Commons
      page: https://commons.wikimedia.org/wiki/File:Tottenham_Hotspurs_tegen_Atletico_Madrid_5-1_Nr_14_en_15_Elftal_Tottenham_Hots,_Bestanddeelnr_915-1586.jpg
      author: Harry Pot for Anefo, Nationaal Archief
    rights:
      license: CC0 1.0
      license_url: https://creativecommons.org/publicdomain/zero/1.0/
      attribution_required: false
      share_alike: false
      personality_rights_warning: false
    suggested_credit: "Photo: Harry Pot / Anefo, Nationaal Archief, CC0"
    tags:
      - archive
      - european-competition
      - team-photograph
      - black-and-white
    notes: >-
      From the Anefo collection of the Dutch Nationaal Archief. Tottenham Hotspur won the
      final 5-1. The licence asks for no credit, but give one anyway. Atletico Madrid is
      the opponent and has no entry in the team registry, because the registry holds only
      English clubs.
    accessed: 2026-09-17
