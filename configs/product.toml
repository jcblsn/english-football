experiment_id = "M7-Understat-Quality-Tilt"
competition_id = "eng-premier-league"
train_window_days = 1095
min_train_matches = 700
calibration_bins = 10
bootstrap_samples = 0
seed = 20260905
development_start = "2015-08-01"
development_end = "2023-07-01"
validation_start = "2023-08-01"
validation_end = "2025-07-01"
holdout_start = "2025-08-01"
holdout_end = "2026-07-01"
evaluation_status = "exploratory historical rolling comparison"
evaluation_note = "Historical development comparison. M2 uses a 1,095-day window in the forecast division; M7 uses expanding history. Understat next-day availability is assumed, not proven by timestamps."

[[models]]
id = "M2-attack-defense-v1"
kind = "attack_defense_poisson"
[models.parameters]
half_life_days = 365.0
ridge = 5.0

[[models]]
id = "M7-xg-v1"
kind = "bayesian_xg_quality_tilt"
train_window_days = 0
# Each division's filter updates only on its own matches; the others feed its entry priors.
# League One stays out of the Championship: its source term did not improve promoted clubs.
[models.train_competitions]
eng-premier-league = ["eng-premier-league", "eng-championship"]
eng-championship = ["eng-premier-league", "eng-championship"]
eng-league-one = ["eng-championship", "eng-league-one", "eng-league-two"]
eng-league-two = ["eng-league-one", "eng-league-two", "eng-national-league"]
[models.parameters]
data_root = "data"
