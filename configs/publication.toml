# The boundary between the private operational archive and the public forecast surface.
# `epl_forecast.publication` defines a separate contract for each public document.
schema_version = 1

[product]
model_version = "v0.2.1"

[boundary]
# Substrings that may never appear in a published key. The code checks these
# values against each contract and each document.
forbidden_key_substrings = [
  "adjustment",
  "argv",
  "availability",
  "dependenc",
  "code_sha",
  "commit",
  "file",
  "fixture_source",
  "lineup",
  "manifest",
  "model_id",
  "model_kind",
  "odds",
  "parquet",
  "path",
  "package_version",
  "player",
  "provenance",
  "quote",
  "request",
  "roster",
  "secret",
  "snapshot_dir",
  "source",
  "squad",
  "token",
  "url",
  "verification",
]

# Values that identify a provider, a local file or a captured payload.
forbidden_value_patterns = [
  "^/",
  "(?i)/users/",
  "(?i)\\.(parquet|csv|db|gz|lock|log)\\b",
  "(?i)https?://",
  "(?i)\\bunderstat\\b",
  "(?i)football[-_ ]?data",
  "(?i)api[-_ ]?football",
  "(?i)\\bfpl\\b",
  "(?i)premierleague\\.com",
  "(?i)bookmaker",
  "(?i)\\bodds\\b",
  "(?i)\\bM[0-9]+(?:[-_][A-Za-z0-9]+)*\\b",
]
