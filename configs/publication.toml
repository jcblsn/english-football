# The boundary between the private operational archive and the public forecast surface.
# `epl_forecast.publication` builds and checks each document against this allowlist.
schema_version = 1

[product]
model_version = "v0.0"

[surface]
allowed_keys = [
  "archived_at",
  "away",
  "away_rate",
  "away_team_id",
  "baseline",
  "basis",
  "brier",
  "carried_from",
  "classwise_ece",
  "competition_id",
  "competition_name",
  "competitions",
  "conditional",
  "coverage",
  "current_points",
  "draw",
  "event",
  "events",
  "fixtures",
  "generated_at",
  "grid_home_rows_away_columns",
  "home",
  "home_rate",
  "home_team_id",
  "horizon_days",
  "href",
  "impact",
  "impacts",
  "kickoff_time",
  "latest",
  "latest_by_competition",
  "log_loss",
  "market_assisted",
  "match_date",
  "match_horizon_days",
  "match_id",
  "matches",
  "max_standard_error",
  "mean_goal_difference",
  "mean_points",
  "mean_position",
  "median_points",
  "median_position",
  "minimum_conditional_samples",
  "model",
  "model_version",
  "model_results_cutoff",
  "movement_floor",
  "name",
  "namespace",
  "omitted_probability",
  "outcome",
  "outcome_counts",
  "p_away",
  "p_draw",
  "p_home",
  "pending_season_snapshots",
  "played",
  "points_distribution",
  "points_intervals",
  "points_quantiles_05_50_95",
  "position_intervals",
  "position_probabilities",
  "position_sd",
  "rms_movement",
  "schema_version",
  "score_probabilities",
  "scored",
  "season_id",
  "settled",
  "simulated_on",
  "simulations",
  "smallest_outcome_count",
  "snapshot_id",
  "snapshots",
  "standard_error",
  "state_observed_at",
  "state_uncertainty",
  "status",
  "sufficient_sample",
  "summary",
  "swing",
  "team_id",
  "teams",
  "top_rms_movement",
  "unavailable_reason",
  "unscheduled_assumption",
  "unscheduled_fixtures",
  "unsettled",
  "unsettled_assumption",
  "unsettled_fixtures",
  "version",
  "window_end",
  "window_start",
  "updated_at",
]

# Only these keys may carry a long hexadecimal digest; anywhere else a digest is
# assumed to identify a provider file and is refused.
digest_keys = []

[boundary]
# Substrings that may never appear in a published key, checked against the
# allowlist itself as well as against every document.
forbidden_key_substrings = [
  "adjustment",
  "argv",
  "availability",
  "dependenc",
  "code_sha",
  "commit",
  "file",
  "fixture_source",
  "lineup",
  "manifest",
  "model_id",
  "model_kind",
  "odds",
  "parquet",
  "path",
  "package_version",
  "player",
  "provenance",
  "quote",
  "request",
  "roster",
  "secret",
  "snapshot_dir",
  "source",
  "squad",
  "token",
  "url",
  "verification",
]

# Values that identify a provider, a local file or a captured payload.
forbidden_value_patterns = [
  "^/",
  "(?i)/users/",
  "(?i)\\.(parquet|csv|db|gz|lock|log)\\b",
  "(?i)https?://",
  "(?i)\\bunderstat\\b",
  "(?i)football[-_ ]?data",
  "(?i)api[-_ ]?football",
  "(?i)\\bfpl\\b",
  "(?i)premierleague\\.com",
  "(?i)bookmaker",
  "(?i)\\bodds\\b",
  "(?i)\\bM[0-9]+(?:[-_][A-Za-z0-9]+)*\\b",
]
