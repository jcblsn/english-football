name: retention

on:
  schedule:
    - cron: "30 10 * * 0"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_DATA_BUCKET: ${{ vars.R2_DATA_BUCKET }}
      R2_PUBLISH_BUCKET: ${{ vars.R2_PUBLISH_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Plan retention without deletion
        run: uv run python scripts/plan_r2_retention.py retention-plan.json --summary retention-summary.md
      - run: cat retention-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retention-dry-run
          path: |
            retention-plan.json
            retention-summary.md
          retention-days: 90
      - name: Require reviewed cleanup
        run: test "$(jq -r '.retention_status.cleanup_review_required' retention-plan.json)" = false
