name: pages

# This workflow materializes the sanitized publication bucket into the Pages artifact.
# The production workflow calls it after a run that publishes a new forecast.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_PUBLISH_BUCKET: ${{ vars.R2_PUBLISH_BUCKET }}
      # The shared repository credential. The site build reads only page324-publish.
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - id: hindcast
        run: uv run epl-forecast materialize --hindcast-cache-key
      - uses: actions/cache@v4
        with:
          path: |
            site/data/hindcasts
            site/.page324-hindcast-cache
          key: page324-hindcasts-${{ steps.hindcast.outputs.cache_key }}
      - run: uv run epl-forecast materialize --site site --hindcasts
      - run: uv run python scripts/check_publishable.py --site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
