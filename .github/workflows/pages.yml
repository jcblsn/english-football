name: pages

# This workflow materializes the sanitized publication bucket into the Pages artifact.
# The production workflow calls it after a run that publishes a new forecast.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_PUBLISH_BUCKET: ${{ vars.R2_PUBLISH_BUCKET }}
      # A read-only credential for page324-publish. See docs/operations.md.
      R2_ACCESS_KEY_ID: ${{ secrets.R2_PAGES_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_PAGES_SECRET_ACCESS_KEY }}
    steps:
      - name: Require the read-only publication credential
        if: env.R2_ACCESS_KEY_ID == '' || env.R2_SECRET_ACCESS_KEY == ''
        run: |
          echo "::error::Set R2_PAGES_ACCESS_KEY_ID and R2_PAGES_SECRET_ACCESS_KEY in the github-pages environment"
          exit 1
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run epl-forecast materialize --site site --hindcasts
      - run: uv run python scripts/check_publishable.py --site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
